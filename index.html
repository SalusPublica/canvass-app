<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvass App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
      <div id="login-box">
        <h2>Canvass Coordinator</h2>
        <p>Enter your team code to continue</p>
        <input type="password" id="team-code-input" placeholder="Team code" />
        <button id="login-button">Enter</button>
        <p id="login-error" style="display:none; color:red;">Incorrect code. Try again.</p>
      </div>
    </div>

    <!-- MAIN APP (hidden until logged in) -->
    <div id="main-app" style="display:none;">

    <h1>Canvass Coordinator</h1>

    <!-- MAP -->
    <section id="map-section">
      <h2>Canvassing Map</h2>
      <button id="toggle-voting-layer">Show 2023 Election Results</button>
      <div id="map"></div>
    </section>

    <!-- MAP CLICK POPUP -->
    <div id="map-popup" style="display:none;">
      <div id="map-popup-inner">
        <h3>Log a visit</h3>
        <p id="map-popup-address">Fetching address...</p>

        <label for="map-visit-type">Type of visit</label>
        <select id="map-visit-type">
          <option value="knock">Door knock</option>
          <option value="leaflet">Leaflet drop</option>
        </select>

        <div id="map-answered-container">
          <label for="map-answered">Did anyone answer?</label>
          <select id="map-answered">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>

        <div id="map-popup-buttons">
          <button id="map-popup-confirm">Log Visit</button>
          <button id="map-popup-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- VISIT LOGGING FORM -->
    <section id="log-section">
      <h2>Log a Visit</h2>
      <form id="visit-form">

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="e.g. Mannerheimintie 5" required />

        <label for="date">Date</label>
        <input type="date" id="date" required />

        <label for="visit-type">Type of visit</label>
        <select id="visit-type">
          <option value="knock">Door knock</option>
          <option value="leaflet">Leaflet drop</option>
        </select>

        <label for="answered" id="answered-label">Did anyone answer?</label>
        <select id="answered">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <button type="submit">Log Visit</button>

      </form>
    </section>

    <!-- VISIT LIST -->
    <section id="visits-section">
      <h2>Visits Logged</h2>
      <ul id="visit-list">
        <p id="empty-message">No visits logged yet.</p>
      </ul>
    </section>

    </div> <!-- end main-app -->

    <script src="script.js"></script>
  </body>
</html>
